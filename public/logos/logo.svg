<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Accessible high-contrast brand styling matching 2md.aiurl.tw & david888.com -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17324D" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Saffron Badge with 2px proportional Deep Blue Border (WCAG Contrast > 8:1) -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="#FFB010" stroke="#17324D" stroke-width="24" filter="url(#badgeShadow)" />

  <!-- 888 Main Brand Text in Deep Blue -->
  <text x="256" y="248" font-size="168" font-weight="900" letter-spacing="-6" fill="#17324D" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">888</text>

  <!-- Distinctive IP Pill Badge in Deep Blue with Saffron Text -->
  <rect x="156" y="294" width="200" height="114" rx="36" fill="#17324D" stroke="#17324D" stroke-width="4" />
  <text x="256" y="380" font-size="88" font-weight="900" letter-spacing="4" fill="#FFB010" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">IP</text>
</svg>
