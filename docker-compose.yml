# docker-compose up -d
version: '3'
services:
    8888ip:
        container_name: 8888ip
        image: ghcr.io/tbdavid2019/8888ip:latest # 8888ip: x.x.x
        stdin_open: true # docker run -i 交互模式
        tty: true        # docker run -t 终端模式
        restart: always # 重启策略 / on-failure:5 重启次数5次 / always 一直重启 / unless-stopped 除非停止 / no 从不重启
        environment:
            FRONTEND_PORT: 6001
            BACKEND_PORT: 11966
        ports:
            - "6001:6001"
