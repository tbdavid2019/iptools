<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords"
    content="8888IP,IP Tool,My IP,IP check,IP lookup,DNS leak test,WebRTC test,Speed test,DNS lookup,Whois lookup, Ping test, privacy test">
  <meta name="description"
    content="A better and open source IP Toolbox. Easy to check what's your IPs, IP information, check for DNS leaks, examine WebRTC connections, test website availability, lookup DNS record, lookup Whois, and test latency from around the world.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="background-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="favicon.svg">
  <title>8888IP - Check My IP Address and Geolocation - WebRTC, DNS Leak, Speed and Network Tests</title>
  <link rel="icon" href="logos/logo.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <script>
    setTimeout(() => {
      document.getElementById('waiting-too-long').innerHTML = `
        <p>Waiting too long? Try to refresh 8888IP.</p>
        <p>Or refresh the page.</p>`
    }, 12000)
  </script>

  <style>
    .jn-spinner {
      border: 4px solid rgb(12, 144, 34);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border-left-color: transparent;
      animation: spin 1s linear infinite;
      margin-top: 10px;
    }

    .jn-loading {
      margin-top: 30vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loading-logo {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-family: Arial, sans-serif;
      font-size: 42px;
      letter-spacing: -2px;
    }

    .loading-logo span {
      color: #212529;
      font-weight: 700;
    }

    .loading-logo strong {
      color: #198754;
      font-weight: 300;
    }

    .jn-spinner-text {
      margin-top: 10px;
      text-align: center;
    }

    .jn-spinner-text p {
      font-size: 14px;
      color: #777;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="jn-loading" class="jn-loading">
    <div>
      <div class="loading-logo" aria-label="8888IP"><span>8888</span><strong>IP</strong></div>
    </div>
    <div class="jn-spinner-text">
      <p>It may take a while for the first time, please wait...</p>
      <p>首次...</p>
    </div>
    <div class="jn-spinner "></div>
    <p class="jn-spinner-text" id="waiting-too-long"></p>
  </div>
  <div id="app"></div>
  <script type="module" src="/frontend/main.js"></script>
</body>

</html>
